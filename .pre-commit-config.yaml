# pytest は push 前、commitlint は commit message の確定時に実行するため、pre-push と commit-msg も install する。
default_install_hook_types: [pre-commit, pre-push, commit-msg]
# rebase や cherry-pick で pre-commit を経ずに作った commit も、push の前に検査する。
default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # ファイルを書き換える hook は commit 時だけに実行する。push 時は push する commit ではなく作業ツリーを見るので、
      # 次の作業のファイルを書き換えて push を失敗させうる。
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
        stages: [pre-commit]
      # main は PR 必須 (ruleset) なので、手元で main に commit した時点で止める。
      # push 時は送信先ではなく checkout 中のブランチを見るので、commit 時だけ実行する。
      # 検証用の mise run pre-commit は main 上でも使えるよう、この hook を SKIP する。
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit]
  # ツールは mise.toml で pin した版を使う。git hook はシェルの PATH を引き継がないことがあるので、mise exec / mise run で起動する。
  # include_deleted を付けた hook は、削除だけの変更でも実行し、削除したファイルを参照する箇所を検出する。
  - repo: local
    hooks:
      - id: mise-task-docs
        name: Sync task docs into README.md
        language: system
        entry: mise run docs
        files: ^(mise\.toml|README\.md)$
        pass_filenames: false
        stages: [pre-commit]
      - id: dprint-fmt
        name: Format json/yaml/markdown/toml/Dockerfile with dprint
        language: system
        # --allow-no-files: 渡されたファイルがすべて dprint.json の excludes 対象のとき
        # (例: uv.lock のみの commit) に exit 14 (No files found) で失敗しないようにする
        entry: mise exec -- dprint fmt --allow-no-files
        types_or: [json, yaml, markdown, toml, dockerfile]
        stages: [pre-commit]
      # correctness profile は actionlint と同じ範囲の検査 (セキュリティの監査は zizmor が行う)。
      # --strict-exit で error 以外 (warn・info) の所見も失敗にし、--shellcheck で shellcheck が無いときに run: の検査を黙って飛ばさない。
      - id: jactionlint
        name: Lint GitHub Actions workflows with jactionlint
        language: system
        entry: mise exec -- jactionlint --profile correctness --strict-exit --shellcheck shellcheck
        types: [yaml]
        files: ^\.github/workflows/
      - id: hadolint
        name: Lint Dockerfile with hadolint
        language: system
        entry: mise exec -- hadolint
        types: [dockerfile]
      - id: typos
        name: Check spelling with typos
        language: system
        entry: mise exec -- typos
      # auditor persona: false positive を含めて全 finding を出す最も厳しい設定。
      # --strict-collection: 解析できない入力を黙って飛ばさず失敗にする。
      # token が無いと online audit (impostor-commit 等) は走らない。CI は ci.yaml の専用 step で実行する
      - id: zizmor
        name: Audit GitHub Actions workflows and hook config with zizmor
        language: system
        entry: mise exec -- zizmor --persona auditor --strict-collection .
        files: ^(\.github/|\.pre-commit-config\.yaml$)
        pass_filenames: false
      # 整形は commit するファイルだけに行う (mise run format はリポジトリ全体を整形し、commit しない未追跡のファイルも書き換える)。
      # ruff format は import を並べ替えないので、import の並びの規則 (I) の修正を先に適用する。
      - id: ruff-isort
        name: Sort python imports with ruff
        language: system
        entry: mise exec -- uv run --locked ruff check --select I --fix
        types: [python]
        stages: [pre-commit]
      - id: ruff-format
        name: Format python with ruff
        language: system
        entry: mise exec -- uv run --locked ruff format
        types: [python]
        stages: [pre-commit]
      # ruff・import-linter・ty の設定は pyproject.toml にあり、版は uv.lock と mise.toml で決まるので、
      # lint は設定だけの変更でも実行する。型検査と層の検査はファイル単位では行えないので、作業ツリー全体を検査する。
      # push 時は作業ツリーを見るので、次の作業の途中の状態で push を止めないよう commit 時だけに実行する (push した変更は CI が検査する)。
      - id: lint
        name: Lint, check layers and type-check python with mise run lint
        language: system
        entry: mise run lint
        files: (\.pyi?$|^(pyproject\.toml|uv\.lock|\.python-version|mise\.toml|mise\.lock)$)
        pass_filenames: false
        include_deleted: true
        stages: [pre-commit]
      - id: test
        name: Run python tests with mise run test
        language: system
        entry: mise run test
        files: (\.pyi?$|^(pyproject\.toml|uv\.lock|\.python-version|mise\.toml|mise\.lock)$)
        pass_filenames: false
        include_deleted: true
        stages: [pre-push]
      # staged 差分だけを対象にした secret スキャン。CI の gitleaks job (全履歴) は commit 後の検知なので、
      # commit 前に止める役割はこの hook が担う
      - id: gitleaks
        name: Scan staged changes for secrets with gitleaks
        language: system
        entry: mise exec -- gitleaks git --pre-commit --redact --staged --verbose
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: commitlint
        name: Lint commit message with commitlint
        # language: node により prek が node と依存を隔離環境へ自前インストールする。
        # 版を指定しないと、prek が管理する node が無い環境では手元の node を版を問わず使うので、commitlint が動く版 (22.12.0 以上) に限る。
        language: node
        language_version: ">=22.12.0"
        additional_dependencies:
          ["@commitlint/cli@21.2.4", "@commitlint/config-conventional@21.2.4"]
        entry: commitlint --edit
        stages: [commit-msg]
