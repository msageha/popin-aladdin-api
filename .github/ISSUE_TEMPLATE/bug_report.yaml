name: バグ報告
description: バグを報告する
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: バグの概要
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      value: |
        1.
        2.
        3.
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作と実際の動作
  - type: textarea
    id: env
    attributes:
      label: 環境
      value: |
        - 機種とファームウェアの版:
        - このリポジトリの commit:
