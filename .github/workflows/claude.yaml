name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # assigned は if 条件 (@claude メンション必須) と噛み合わないため opened のみ
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

concurrency:
  # issue / PR 単位で直列化する。実行中ジョブは変更を push しうるためキャンセルしない
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    # runner を起動する前の一次フィルタ: OWNER / MEMBER による @claude メンションに限る
    # (COLLABORATOR は read-only の outside collaborator も含みうるため許可しない)。
    # 書き込み権限の厳密な検証は claude-code-action 内部でも行われる。
    # author_association はイベントごとに持ち主が異なる。issue_comment は comment と issue の
    # 両方を持つため comment を先に評価する。
    if: |
      contains(fromJSON('["OWNER", "MEMBER"]'),
        github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write
      issues: write
      # claude-code-action が OIDC 経由で Claude GitHub App の token を取得するために必要
      id-token: write
      # PR の CI 結果を Claude が読むために必要
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # claude-code-action は自前の token で git 認証を構成する
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
