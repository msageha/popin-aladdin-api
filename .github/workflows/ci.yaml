name: CI

on:
  # main は PR 必須 (docs/development.md「GitHub リポジトリ設定」) で、PR の CI を通ったものしか入らないので、push では走らせない。
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# job の name がそのまま required status check の名前になる (docs/development.md「GitHub リポジトリ設定」参照)。
jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise.lock があるため `mise install --locked` になり、mise.toml との不整合はここで失敗する。
      - name: Install mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      # lint hook (mise run lint) は uv run --locked で動くため、uv.lock と pyproject.toml の不整合もここで失敗する。
      # zizmor は次の step で online audit 込みで、gitleaks は gitleaks job で全履歴を検査する
      # (gitleaks の hook は staged の差分だけを見るので、CI の checkout では何も検査しない)。
      - name: Run prek
        run: mise exec -- prek run --all-files
        env:
          SKIP: no-commit-to-branch,zizmor,gitleaks

      # token は他の hook に渡さないよう、この step だけに渡す
      - name: Run zizmor with online audits
        run: mise exec -- zizmor --persona auditor --strict-collection .
        env:
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # コミット履歴全体をスキャン対象にする
          fetch-depth: 0
          persist-credentials: false

      # この job が使う gitleaks だけを入れる。postinstall の hook (prek install) は入れていない prek を使うので走らせない。
      - name: Install mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: gitleaks
        env:
          MISE_NO_HOOKS: "1"

      - name: Run gitleaks
        run: mise exec gitleaks -- gitleaks git --redact -v .

  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # テストが使うのは uv (と uv.lock の依存) だけなので、ほかのツールは入れない。
      # postinstall の hook (prek install) は入れていない prek を使うので走らせない。
      - name: Install mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: uv
        env:
          MISE_NO_HOOKS: "1"

      - name: Run tests
        run: mise run --skip-tools test

  # ランナーの distroless には shell が無く、builder から写した Python と venv は base や uv の更新で壊れうるので、
  # 両 arch で実際に build して起動を確かめる。
  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # check-image が使うのは runner の docker と curl だけなので、mise 本体だけを入れ、ツールの導入・キャッシュの
      # 復元・postinstall の hook (prek install) を省く。
      - name: Install mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: false
          cache: false

      - name: Build and check the image
        run: mise run --skip-tools check-image
