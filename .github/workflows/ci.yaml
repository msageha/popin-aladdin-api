name: CI

on:
  # push トリガーは置かない: main は PR 必須 (ruleset。README「GitHub リポジトリ設定」参照) なので
  # PR で検証済みの内容しか入らない。
  # デフォルト types の明示: closed 等 CI が不要な PR イベントでは走らせない
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# job の name がそのまま required status check の名前になる (README「GitHub リポジトリ設定」参照)。
jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise.lock があるため `mise install --locked` になり、mise.toml との不整合はここで失敗する。
      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      # lint hook (mise run lint) は uv run --locked で動くため、uv.lock と pyproject.toml の不整合もここで失敗する
      - name: Run prek
        run: mise run pre-commit

      # prek の zizmor hook は token が無く offline audit だけになるので、online audit
      # (impostor-commit・known-vulnerable-actions 等) を含めてここで実行する。
      # token は他の hook に渡さないよう、この step だけに渡す
      - name: Run zizmor with online audits
        run: mise exec -- zizmor --persona auditor --strict-collection .
        env:
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # コミット履歴全体をスキャン対象にする
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Run gitleaks
        run: mise exec -- gitleaks git --redact -v .

  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Run tests
        run: mise run test

  # ランナーの distroless には shell が無く、builder から写した Python と venv は base や uv の更新で壊れうるので、
  # 両 arch で実際に build して起動を確かめる。
  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # check-image が使うのは runner の docker と curl だけなので、mise 本体だけを入れ、ツールの導入・キャッシュの
      # 復元・postinstall の hook (prek install) を省く。
      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
          cache: false

      - name: Build and check the image
        run: mise run --skip-tools check-image
