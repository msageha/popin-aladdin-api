name: CI

on:
  # push トリガーは置かない: main は PR 必須 (ruleset。README「GitHub リポジトリ設定」参照) なので
  # PR で検証済みの内容しか入らない。
  # デフォルト types の明示: closed 等 CI が不要な PR イベントでは走らせない
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# job 名がそのまま required status check の名前になる (README「GitHub リポジトリ設定」参照)。
jobs:
  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise.lock があるため `mise install --locked` になり、mise.toml との不整合はここで失敗する。
      - name: Install mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      # ruff / ty の hook は uv run --locked で動くため、uv.lock と pyproject.toml の不整合もここで失敗する
      - name: Run prek
        run: mise exec -- prek run --all-files

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # コミット履歴全体をスキャン対象にする
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      - name: Run gitleaks
        run: mise exec -- gitleaks git --redact -v .

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      - name: Run tests
        run: mise exec -- uv run --locked pytest
