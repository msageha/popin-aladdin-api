[project]
name = "popin-aladdin-api"
version = "0.1.0"
description = "Local REST API for the popIn Aladdin: UPnP/DLNA MediaRenderer plus the proprietary remote-control protocol"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.121",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "coverage>=7.15.0",
    "pre-commit>=3.7",
    "pytest>=8",
    "ruff>=0.12",
    "ty>=0.0.57",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "C90", "E", "F", "I", "N", "RUF", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
