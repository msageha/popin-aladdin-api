# ツールのバージョンは Renovate (mise manager) が bump し、mise.lock も同じ PR で更新する。
# latest 指定にしない。手で変更したときは `mise lock` を実行して mise.lock を追従させる。
# Python 本体は mise ではなく uv が管理する (.python-version の 3.14 を取得する)。
[tools]
uv = "0.13.7"
prek = "0.5.10"
actionlint = "1.7.12"
dprint = "0.64.3"
fnox = "v1.47.0"
gitleaks = "8.30.1"
hadolint = "2.15.1"
typos = "1.52.2"
zizmor = "1.32.0"
# actionlint は PATH に shellcheck があるときだけ run: スクリプトを検査するため、
# ローカルと CI で検査内容が変わらないように pin する
shellcheck = "0.11.0"
"npm:pyright" = "1.1.414"
# npm: backend が pyright を npm で入れるので、node も pin する
node = "26.13.1"

[env]
POPIN_ALADDIN_HOST = "http://172.16.1.113"

[tasks.dev]
description = "Run the API server with auto-reload on http://127.0.0.1:8000"
run = "uv run --locked uvicorn popin_aladdin_api.main:app --reload --host 127.0.0.1 --port 8000"

[tasks.test]
description = "Run pytest under coverage and print the report"
run = [
  "uv run --locked coverage run -m pytest",
  "uv run --locked coverage report",
]

[tasks.lint]
description = "Check lint and formatting (ruff), layer dependencies (import-linter) and types (ty / pyright)"
# 1 つ目の失敗で止めず、全部の検査の結果を出してから失敗を返す。
run = """
#!/usr/bin/env bash
status=0
uv run --locked ruff check . || status=1
uv run --locked ruff format --check . || status=1
uv run --locked lint-imports || status=1
uv run --locked ty check || status=1
pyright || status=1
exit "$status"
"""

[tasks.format]
description = "Format python sources with ruff and sort imports"
# ruff format は import を並べ替えないので、import の並びの規則 (I) の修正を先に適用する。
run = [
  "uv run --locked ruff check --select I --fix .",
  "uv run --locked ruff format .",
]

[tasks.pre-commit]
description = "Run the pre-commit stage hooks on all tracked files with prek (same as the CI prek job)"
# no-commit-to-branch は commit 先のブランチを見る hook で、検証には関係しない。main を checkout したままでも検証できるよう外す。
run = "SKIP=no-commit-to-branch prek run --all-files"

[tasks.build-image]
description = "Build the Docker image popin-aladdin-api:latest"
run = "docker build -t popin-aladdin-api:latest ."

[tasks.run-image]
description = "Run the Docker image on port 8000 (and the UDP reply port) with the settings from the environment"
# -e NAME (値なし) は設定されている変数だけを渡すので、未設定の任意項目にはアプリ (settings.py) の既定値が使われる。
# UDP JSON コマンドの応答はデバイスからホストの CONTROL_REPLY_UDP_PORT に届くので、container の同じポートへ公開する。
run = "docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges -p 8000:8000 -p ${CONTROL_REPLY_UDP_PORT:-16751}:${CONTROL_REPLY_UDP_PORT:-16751}/udp -e POPIN_ALADDIN_HOST -e UPNP_PORT -e DESCRIPTION_PATH -e CONTROL_TCP_PORT -e CONTROL_UDP_PORT -e CONTROL_CMD_UDP_PORT -e CONTROL_REPLY_UDP_PORT -e DISCOVERY_UDP_PORT -e TIMEOUT popin-aladdin-api:latest"

[tasks.check-image]
description = "Build the Docker image and check that it serves /api/health with a read-only root filesystem and no capabilities"
depends = ["build-image"]
# /api/health はデバイスに接続しないので、ダミーの接続先で起動できる。host 側の port は空きを Docker に選ばせ、開発サーバーと衝突させない。
run = """
container=$(docker create --read-only --cap-drop ALL --security-opt no-new-privileges \\
  -p 127.0.0.1::8000 -e POPIN_ALADDIN_HOST=127.0.0.1 popin-aladdin-api:latest)
trap 'docker rm -f "$container" >/dev/null' EXIT
trap 'exit 130' INT TERM
docker start "$container" >/dev/null
url="http://$(docker port "$container" 8000/tcp)/api/health"
# -f は 3xx を成功とみなすので使わず、curl の成否と status code が 200 であることの両方を見る
if ! status=$(curl -sS -o /dev/null -w '%{http_code}' --noproxy 127.0.0.1 --max-time 5 --retry 10 --retry-all-errors --retry-delay 1 "$url") \\
  || [ "$status" != 200 ]; then
  echo "GET /api/health failed (status: $status)" >&2
  docker logs "$container"
  exit 1
fi
"""

[tasks.clean]
description = "Remove caches and coverage artifacts"
run = [
  "find . -path ./.venv -prune -o -name '__pycache__' -type d -prune -exec rm -r {} +",
  "rm -rf .pytest_cache .ruff_cache .ty_cache .import_linter_cache htmlcov .coverage",
]

[tasks.docs]
description = "Sync the task list embedded in README.md with mise.toml"
run = "mise generate task-docs --inject --output README.md"

# template から生成したリポジトリで実行し、共通ファイルが template の main からどれだけ離れたかを見る。
# README.md / CODEOWNERS / CLAUDE.md / mise.lock はリポジトリ固有に書き換える前提なので対象外。
# claude.yaml / claude-sweep.yaml は GitHub 経由で Claude を使わないため取り込んでおらず、対象外。
[tasks.template-diff]
description = "Diff shared files against dope-corp/template main"
run = '''
#!/usr/bin/env bash
set -euo pipefail
repo="dope-corp/template"
files=(
  .editorconfig .gitattributes .gitignore .pre-commit-config.yaml commitlint.config.mjs
  dprint.json fnox.toml mise.toml renovate.json
  .github/PULL_REQUEST_TEMPLATE.md
  .github/ISSUE_TEMPLATE/config.yml .github/ISSUE_TEMPLATE/bug_report.yaml .github/ISSUE_TEMPLATE/feature_request.yaml
  .github/workflows/ci.yaml
)
err="$(mktemp)"
trap 'rm -f "${err}"' EXIT
failed=0
for f in "${files[@]}"; do
  if ! upstream="$(gh api "repos/${repo}/contents/${f}" -H 'Accept: application/vnd.github.raw+json' 2>"${err}")"; then
    # 404 は template 側に無いファイル (skip)。それ以外 (未認証・通信障害・rate limit) は比較できていないので失敗にする
    if grep -q 'HTTP 404' "${err}"; then
      echo "!! ${f}: not in ${repo} main (skipped)"
    else
      echo "!! ${f}: fetch failed: $(cat "${err}")" >&2
      failed=1
    fi
    continue
  fi
  if [[ ! -f "${f}" ]]; then
    echo "!! ${f}: missing locally"
    continue
  fi
  diff -u --label "template/${f}" --label "${f}" <(printf '%s\n' "${upstream}") "${f}" || true
done
exit "${failed}"
'''

[hooks]
# .venv はここでは作らない: uv sync が古い uv.lock を書き換えると CI の `uv run --locked` が不整合を検出できなくなる。
# .venv は最初の `uv run --locked` (mise run test / prek の hook) が uv.lock どおりに作る
postinstall = "prek install"

[settings]
lockfile = true
