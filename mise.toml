# 版は exact で pin し (latest にしない)、Renovate が mise.lock と同じ PR で bump する。手で変えたら `mise lock` を実行する。
# Python 本体は mise ではなく uv が .python-version に従って取得する。
[tools]
uv = "0.13.7"
prek = "0.5.10"
# actionlint の後継の fork。短い名前 (jactionlint) は Renovate が版を追えないので、aqua の backend で書く。
"aqua:jdx/jactionlint" = "2.6.0"
dprint = "0.64.3"
gitleaks = "8.30.1"
hadolint = "2.15.1"
typos = "1.52.2"
zizmor = "1.32.0"
# jactionlint が run: スクリプトの検査に使う。ローカルと CI で検査内容が変わらないように pin する
shellcheck = "0.11.0"

[env]
POPIN_ALADDIN_HOST = "http://172.16.1.113"

[tasks.dev]
description = "API サーバーを http://127.0.0.1:8000 で起動する (コードを変更すると自動で再起動する)"
run = "uv run --locked uvicorn popin_aladdin_api.main:app --reload --host 127.0.0.1 --port 8000"

[tasks.test]
description = """
テストを実行し、coverage を表示する。

テストは実機に接続せず、テスト用の偽のデバイスを相手に動く。
"""
# 計測は worker・API サーバーのプロセスごとの断片に分かれ、report がまとめて集計する。
# 中断した実行や、同じ checkout で並行して走る実行 (手動と pre-push の hook 等) の断片を混ぜないよう、
# 実行ごとの一時ディレクトリに置く。
run = """
#!/usr/bin/env bash
set -euo pipefail
data_dir="$(mktemp -d)"
trap 'rm -rf "$data_dir"' EXIT
export COVERAGE_FILE="$data_dir/.coverage"
uv run --locked coverage run -m pytest
uv run --locked coverage report
# main.py は subprocess の API サーバーでだけ実行される。計測されていなければ子プロセスの計測が壊れている。
if ! uv run --locked coverage report --include=src/popin_aladdin_api/main.py --fail-under=1 >/dev/null; then
  echo "src/popin_aladdin_api/main.py was not measured: coverage of the API server subprocess is broken" >&2
  exit 1
fi
"""

[tasks.lint]
description = """
Python のコードを、ファイルを書き換えずに検査する (lint・整形・モジュール間の依存・型)。

1 つの検査が失敗しても残りを実行し、最後に失敗を返す。
"""
run = """
#!/usr/bin/env bash
status=0
uv run --locked ruff check . || status=1
uv run --locked ruff format --check . || status=1
uv run --locked lint-imports || status=1
uv run --locked ty check || status=1
exit "$status"
"""

[tasks.format]
description = "Python のコードの import を並べ替え、整形する (ファイルを書き換える)"
# ruff format は import を並べ替えないので、import の並びの規則 (I) の修正を先に適用する。
run = [
  "uv run --locked ruff check --select I --fix .",
  "uv run --locked ruff format .",
]

[tasks.pre-commit]
description = """
commit 時の hook を、git で追跡している全ファイルに実行する。

整形の hook はファイルを書き換える。main への commit を止める hook は実行しない。
"""
# no-commit-to-branch は commit 先のブランチを見る hook で、検証には関係しない。main を checkout したままでも検証できるよう外す。
run = "SKIP=no-commit-to-branch prek run --all-files"

[tasks.build-image]
description = "Docker イメージ `popin-aladdin-api:latest` を build する"
run = "docker build -t popin-aladdin-api:latest ."

[tasks.run-image]
description = """
Docker イメージ `popin-aladdin-api:latest` を build して起動する。

設定されている環境変数をコンテナに渡し、root filesystem を read-only にして capability をすべて外した状態で起動する。
API はホストのすべてのネットワークインターフェースの 8000/tcp に公開する。デバイスからの UDP の応答を受けるため、`CONTROL_REPLY_UDP_PORT` (既定 16751) も UDP で公開する。
"""
depends = ["build-image"]
# -e NAME (値なし) は設定されている変数だけを渡すので、未設定の任意項目にはアプリ (settings.py) の既定値が使われる。
run = "docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges -p 8000:8000 -p ${CONTROL_REPLY_UDP_PORT:-16751}:${CONTROL_REPLY_UDP_PORT:-16751}/udp -e POPIN_ALADDIN_HOST -e UPNP_PORT -e DESCRIPTION_PATH -e CONTROL_TCP_PORT -e CONTROL_UDP_PORT -e CONTROL_CMD_UDP_PORT -e CONTROL_REPLY_UDP_PORT -e DISCOVERY_UDP_PORT -e TIMEOUT popin-aladdin-api:latest"

[tasks.check-image]
description = """
Docker イメージを build し、起動して `/api/health` が応答するかを確かめる (CI の `image` job と同じ)。

デバイスには接続しない。root filesystem を read-only にし、capability をすべて外した状態で確かめる。
"""
depends = ["build-image"]
# /api/health はデバイスに接続しないので、ダミーの接続先で起動できる。host 側の port は空きを Docker に選ばせ、開発サーバーと衝突させない。
run = """
container=$(docker create --read-only --cap-drop ALL --security-opt no-new-privileges \\
  -p 127.0.0.1::8000 -e POPIN_ALADDIN_HOST=127.0.0.1 popin-aladdin-api:latest)
# 失敗したときは (起動直後に終了して docker port が失敗した場合も) container のログを出してから片付ける
trap 'rc=$?; [ "$rc" -eq 0 ] || docker logs "$container"; docker rm -f "$container" >/dev/null; exit "$rc"' EXIT
trap 'exit 130' INT TERM
docker start "$container" >/dev/null
url="http://$(docker port "$container" 8000/tcp)/api/health"
# -f は 3xx を成功とみなすので使わず、curl の成否と status code が 200 であることの両方を見る
if ! status=$(curl -sS -o /dev/null -w '%{http_code}' --noproxy 127.0.0.1 --max-time 5 --retry 10 --retry-all-errors --retry-delay 1 "$url") \\
  || [ "$status" != 200 ]; then
  echo "GET /api/health failed (status: $status)" >&2
  exit 1
fi
"""

[tasks.clean]
description = "検査とテストが作るキャッシュを削除する"
run = [
  "find src tests -name '__pycache__' -type d -prune -exec rm -r {} +",
  "rm -rf .pytest_cache .ruff_cache .ty_cache .import_linter_cache .hypothesis",
]

[tasks.docs]
description = """
README.md のタスク一覧を、mise.toml のタスクの定義から生成し直す。

mise.toml か README.md を commit するときは、hook が自動で実行する。
"""
run = "mise generate task-docs --inject --output README.md"

[hooks]
# .venv はここでは作らない: uv sync が古い uv.lock を書き換えると CI の `uv run --locked` が不整合を検出できなくなる。
# .venv は最初の `uv run --locked` (mise run test / prek の hook) が uv.lock どおりに作る
postinstall = "prek install"

[settings]
lockfile = true
